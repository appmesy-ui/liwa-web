<!-- public/liwa-logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <rect width="200" height="80" fill="none"/>

  <!-- Icono </> movido más a la derecha -->
  <g transform="translate(8,28) scale(0.65)" stroke="#00B3B3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 2 L6 18 L18 34"/>     <!-- < -->
    <path d="M28 34 L38 2"/>          <!-- / -->
    <path d="M48 2 L60 18 L48 34"/>   <!-- > -->
  </g>

  <!-- Texto LIWA (ya lo dejaste en x=65) -->
  <text x="65" y="55"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="40">
    <tspan fill="#FFFFFF" font-weight="800">LI</tspan>
    <tspan fill="#C9CED6" font-weight="700" dx="-8">WA</tspan>
  </text>
</svg>

